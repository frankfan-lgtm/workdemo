<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即梦 AI 创作助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">即梦 AI</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <span class="nav-icon">🎨</span>
                    <span>创作助手</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">💡</span>
                    <span>灵感广场</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">📁</span>
                    <span>我的资产</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="source-legend">
                    <div class="legend-title">搜索数据源</div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#6366f1"></span>
                        联网搜索 (豆包)
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#f59e0b"></span>
                        优质素材库 (RAG)
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#10b981"></span>
                        我的资产
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot" style="background:#ec4899"></span>
                        社区灵感
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 聊天区域 -->
            <div class="chat-area" id="chatArea">
                <div class="welcome-message">
                    <div class="welcome-icon">✦</div>
                    <h2>即梦 AI 创作助手</h2>
                    <p>告诉我你想创作什么，我会帮你搜索灵感素材</p>
                    <div class="quick-prompts">
                        <button class="quick-prompt" onclick="sendQuickPrompt(this)">帮我找一些电商产品图的参考灵感</button>
                        <button class="quick-prompt" onclick="sendQuickPrompt(this)">我想画一幅赛博朋克风格的城市插画</button>
                        <button class="quick-prompt" onclick="sendQuickPrompt(this)">找找最新的小红书风格写真参考</button>
                        <button class="quick-prompt" onclick="sendQuickPrompt(this)">看看我之前收藏的国风素材</button>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        id="userInput"
                        placeholder="描述你想创作的内容，我会帮你搜索灵感素材..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
